
name: RaceDay Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API dependencies
        run: dotnet restore RaceDayAPI.csproj

      - name: Build API
        run: dotnet build RaceDayAPI.csproj --configuration Release --no-restore

      - name: Run API unit tests
        run: dotnet test RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release

      - name: Restore MVC dependencies
        run: dotnet restore RaceDayMVC1/RaceDayMVC1.csproj

      - name: Build MVC
        run: dotnet build RaceDayMVC1/RaceDayMVC1.csproj --configuration Release
