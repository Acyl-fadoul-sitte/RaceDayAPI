



services:
  racedayapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raceday-api
    ports:
      - "5142:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "${RACEDAY_DB_CONNECTION:?Set RACEDAY_DB_CONNECTION in .env}"
      Jwt__Key: "${RACEDAY_JWT_KEY:?Set RACEDAY_JWT_KEY in .env}"
    restart: unless-stopped

  racedaymvc:
    build:
      context: ./RaceDayMVC1
      dockerfile: Dockerfile
    container_name: raceday-mvc
    ports:
      - "5288:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Development"
      ApiSettings__BaseUrl: "http://racedayapi:8080/"
    depends_on:
      - racedayapi
    restart: unless-stopped
